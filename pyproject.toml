[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "LLM inference engine with KV cache, batching, and serving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
            { name = "acsingh" }
]
dependencies = [
                "torch==2.4.0",
                "transformers==4.44.2",
                "sentencepiece==0.2.1",
                "numpy==2.2.6",
                "pyyaml==6.0.3",
                "fastapi==0.115.12",
                "uvicorn[standard]==0.30.6",
                "httpx==0.27.2",
                "psutil==7.2.2",
                "pynvml==11.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.23.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning",]